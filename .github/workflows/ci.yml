name: CI

on:
  push:
    # 版本分支通配（0.1.x / 0.2.x / …）+ main：切 minor 分支不再手改触发器（本次差点漏推 0.2.x）。
    branches: [main, '[0-9].[0-9].x']
  pull_request:
    branches: [main, '[0-9].[0-9].x']

permissions:
  contents: read

# A new push cancels the in-flight check of the same branch instead of spending Windows minutes on
# a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # The gate suite is seconds of work; the minute is runner startup. A hung runner should burn 15,
    # not the 360 default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the privacy audit below runs -FullHistory, so the CI backstop covers
          # the historical-blob vector even when the local pre-push hook is skipped (--no-verify).
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Self-measured: the local evidence baseline for every gate is SDK 10.0.204 (no global.json),
          # so the runner reproduces that machine. net472 targeting resolves from NuGet
          # (Krafs.Rimworld.Ref) either way.
          dotnet-version: '10.0.x'

      # The gates a maintainer runs by hand are the gates CI runs, so a push cannot be green locally
      # and untested on the runner. Mwah's verify-local owns its builds (Release + Steam + GitHub
      # flavor compiles), so no separate restore/build step is needed before it.
      - name: Verify (full gate suite)
        shell: pwsh
        run: ./scripts/verify-local.ps1

      # 与本地 pre-push hook 同一份审计、同一档位（-FullHistory）：push 的把关是机械的、双层的
      # （hook 拦在推之前，CI 兜在推之后），不再依赖任何人记得跑仪式。
      - name: Privacy audit (full history)
        shell: pwsh
        run: ./scripts/privacy-audit.ps1 -FullHistory

      # pack-dev 默认只暂存文件夹（dev 的用途是整目录拷进 Mods/）；CI 要归档产物，
      # 所以点名 -Zip——stage-package 的写手保证 zip 根在 Mwah/ 下且盖 commit 日期。
      - name: Pack (dev snapshot)
        if: github.event_name == 'push'
        shell: pwsh
        run: ./scripts/pack-dev.ps1 -Zip

      - name: Upload dev artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Mwah-dev-${{ github.sha }}
          path: dist/dev/*.zip
          retention-days: 14
